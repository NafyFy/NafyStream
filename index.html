<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nafy Stream</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Limelight&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <div class="theater-curtains">
        <header>
            <div class="marquee-board">
                <div class="marquee-lights">
                    <h1>Nafy Streaming </h1>
                </div>
            </div>
            <nav class="elegant-nav">
                <button onclick="showSection('home')">Programmation</button>
                <button onclick="showSection('search')">Archives</button>
            </nav>
        </header>

        <main>
            <!-- SECTION ACCUEIL -->
            <section id="home-section" class="active-section">
                <h2 class="section-title">À l'affiche</h2>
                <div id="trending-results" class="results-grid"></div>
            </section>

            <!-- SECTION RECHERCHE -->
            <section id="search-section" style="display: none;">
                <div class="search-box">
                    <h2>Tu veux regarder quoi mon quoicouskibidi ?</h2>
                    <div class="filters">
                        <input type="text" id="searchInput" placeholder="Titre du film...">
                        <button onclick="searchMovie()">Vas chercher</button>
                    </div>
                </div>
                <div id="search-results" class="results-grid"></div>
            </section>

            <!-- SECTION LECTEUR VIDÉO -->
            <section id="player-section" style="display: none;">
                <button class="back-btn" onclick="showSection('home')"> <-- Retour</button>

            <div class="server-selector" style="text-align: center; margin-bottom: 20px;">
                <button id="btn-frembed" class="server-btn" onclick="changeServer('frembed')">Projecteur 1 (Frembed)</button>
                <button id="btn-moviez" class="server-btn" onclick="changeServer('moviez')">Projecteur 2 (Moviez)</button>
            </div>

                <div class="screen-frame">
                    <div id="player-container"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
