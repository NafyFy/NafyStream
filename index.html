<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nafy Streaming</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">Nafy Stream</div>
        <nav>
            <button onclick="showSection('home')">Accueil</button>
            <button onclick="showSection('search')">Recherche Avancée</button>
        </nav>
    </header>

    <main>
        <section id="home-section" class="active-section">
            <h2>🔥 Tendances du moment</h2>
            <div id="trending-results" class="results-grid horizontal-scroll"></div>

            <h2>🎬 Classiques Incontournables</h2>
            <div id="classic-results" class="results-grid horizontal-scroll"></div>
        </section>

        <section id="search-section" style="display: none;">
            <div class="search-box">
                <h2>Trouver une pépite</h2>
                <div class="filters">
                    <input type="text" id="searchInput" placeholder="Titre du film...">
                    <input type="number" id="yearInput" placeholder="Année (ex: 1994)">
                    <select id="typeInput">
                        <option value="">Tout (Films & Séries)</option>
                        <option value="movie">Film uniquement</option>
                        <option value="series">Série uniquement</option>
                    </select>
                    <button onclick="searchMovie()">Chercher</button>
                </div>
            </div>
            <div id="search-results" class="results-grid"></div>
        </section>

        <section id="player-section" style="display: none;">
            <button class="back-btn" onclick="showSection('home')">← Retour</button>
            <div id="player-container"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
