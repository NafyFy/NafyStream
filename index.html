<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Site de Streaming</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>StrrStrrrStrrream</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Rechercher un film (ex: Inception)...">
            <button onclick="searchMovie()">Rechercher</button>
        </div>
    </header>

    <main>
        <!-- C'est ici que le lecteur vidéo apparaîtra -->
        <div id="player-container"></div>
        
        <!-- C'est ici que les résultats de recherche apparaîtront -->
        <div id="results" class="results-grid"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
