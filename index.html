<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nafy Streaming</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Limelight&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="theater-curtains">
        <header>
            <div class="marquee-board">
                <div class="marquee-lights">
                    <h1>🌟 Nafy Streaming 🌟</h1>
                </div>
            </div>
            <nav class="ticket-nav">
                <button onclick="showSection('home')">🎟️ Programmation</button>
                <button onclick="showSection('search')">🔍 Archives</button>
            </nav>
        </header>

        <main>
            <section id="home-section" class="active-section">
                <h2 class="section-title">À l'affiche aujourd'hui</h2>
                <div id="trending-results" class="results-grid horizontal-scroll"></div>

                <h2 class="section-title">Chefs-d'œuvre restaurés</h2>
                <div id="classic-results" class="results-grid horizontal-scroll"></div>
            </section>

            <section id="search-section" style="display: none;">
                <div class="search-box">
                    <h2>Fouiller les archives</h2>
                    <div class="filters">
                        <input type="text" id="searchInput" placeholder="Titre du film...">
                        <input type="number" id="yearInput" placeholder="Année (ex: 1994)">
                        <button onclick="searchMovie()">Projeter</button>
                    </div>
                </div>
                <div id="search-results" class="results-grid"></div>
            </section>

            <section id="player-section" style="display: none;">
                <button class="back-btn" onclick="showSection('home')">← Retour au Hall</button>
                <div class="screen-frame">
                    <div id="player-container"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
